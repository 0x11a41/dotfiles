# ── General ───────────────────────────────────────────────────────────────────

outputs = "Active"
position = "Top"
enable_esc_key = true
region = "en-IN"
language = "en-US"

# ── Logging ───────────────────────────────────────────────────────────────────

[logging]
level = "warn"

# ── OSD ──────────────────────────────────────────────────────────────────────

[osd]
enabled = true
timeout = 850

# ── Animations ────────────────────────────────────────────────────────────────

[animations]
enabled = true

# ── Modules ──────────────────────────────────────────────────────────────────

[modules]
left = ["AppLauncher", ["Workspaces"]]
center = ["Tempo", "MediaPlayer"]
right = [
    "SystemInfo",
    "ClipHist",
    ["Tray", "Privacy", "Settings"],
    "Notifications"
]

# ── Notifications ────────────────────────────────────────────────────────────

[notifications]
format = "%m/%d %H:%M"
show_timestamps = true
show_bodies = true
grouped = true
toast = true
toast_position = "TopRight"
toast_timeout = 3000
toast_limit = 4
toast_max_height = 150

# blocklist = ["blueman", "^org\\.gnome\\."]

# ── Window Title ─────────────────────────────────────────────────────────────

[window_title]
truncate_title_after_length = 48

# ── Media Player ─────────────────────────────────────────────────────────────

[media_player]
indicator_format = "Icon"
indicator_visualizer = "Background"
visualizer_framerate = 30
max_text_length = 50

# ── Custom Modules ───────────────────────────────────────────────────────────

[[CustomModule]]
name = "AppLauncher"
type = "Button"
icon = "󱗼"
command = "fuzzel --placeholder=' Launch using integrated graphics'"

[[CustomModule]]
name = "ClipHist"
type = "Button"
icon = "⧉"
command = "pkill -x fuzzel || cliphist list | fuzzel -w 48 --dmenu --mesg='Clipboard history' | cliphist decode | wl-copy"

# ── Settings ─────────────────────────────────────────────────────────────────

[settings]
lock_cmd = "playerctl --all-players pause; hyprlock &"

wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

remove_airplane_btn = true

audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"

hibernate_cmd = "systemctl hibernate"

peripheral_indicators = "All"

volume_step = 4
brightness_step = 3
max_volume = 150

enable_tooltips = false

indicators = [
    "IdleInhibitor",
    "PowerProfile",
    "Audio",
    "Microphone",
    "Vpn",
    "Battery",
    "Brightness"
]

# ── Custom Settings Buttons ─────────────────────────────────────────────────

[[settings.CustomButton]]
name = "Dark Mode"
icon = "🌗"
command = "~/.config/hypr/switch_theme.sh"
status_command = "dconf read /org/gnome/desktop/interface/color-scheme | grep -q 'prefer-dark'"
# tooltip = "Toggle dark mode"

[[settings.CustomButton]]
name = "Tailnet"
icon = "⠿"
command = "tailscale status && tailscale down || tailscale up"
status_command = "tailscale status"

# ── System Info ──────────────────────────────────────────────────────────────

[system_info]
indicators = ["UploadSpeed", "DownloadSpeed"]
interval = 5

# ── Clock ────────────────────────────────────────────────────────────────────

[tempo]
clock_format = "%a %d %b %R"

# ── Appearance ───────────────────────────────────────────────────────────────

[appearance]
font_name = "Adwaita Sans"
opacity = 0.80
blur = "auto"
scale_factor = 1.0
primary_color = "#DAC6FA"
success_color = "#a6e3a1"
text_color = "#F8F8F2"
workspace_colors = [
    "#DAC6FA",
    "#b4befe",
    "#cba6f7"
]

# ── Transparent Bar ──────────────────────────────────────────────────────────

[appearance.bar]
surface = "solid"

# ── Menu ─────────────────────────────────────────────────────────────────────

[appearance.menu]
backdrop = 0.2

# ── Palette ─────────────────────────────────────────────────────────────────

[appearance.danger_color]
base = "#FF6B6B"
weak = "#F4A460"

[appearance.background_color]
base = "#1E1F22"
weak = "#2B2C30"
strong = "#383A40"

[appearance.secondary_color]
base = "#1a1a1a"
