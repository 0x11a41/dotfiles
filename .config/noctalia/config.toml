[audio]
enable_overdrive = true
sound_volume = 0.9499999787658453

[bar]
order = [ "main" ]

    [bar.main]
    center = [ "control-center", "clock", "privacy" ]
    end = [
        "network_tx",
        "network_rx",
        "tray",
        "brightness",
        "battery",
        "bluetooth",
        "network",
        "volume",
        "session",
        "notifications"
    ]
    font_family = "Adwaita Sans"
    margin_ends = 0
    padding = 12
    radius = 0
    shadow = false
    start = [ "launcher", "workspaces", "media" ]
    thickness = 32
    widget_spacing = 12

        [bar.main.dead_zone.actions]
        right = "none"
        scroll_down = "workspace-switch next"
        scroll_up = "workspace-switch prev"

[bluetooth]
connect_when_enabled = true

[control_center]
width = 750

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
smart_auto_hide = true

[hot_corners]
delay_ms = 400
enabled = true

    [hot_corners.top_left]
    action = "command"
    command = "noctalia msg panel-toggle wallpaper"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.68999998457729816
tint_intensity = 0.15999999642372131
transition = [ "fade", "zoom" ]
transition_duration = 300

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 788.99981689453125
    cy = 703.9998779296875
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 768.0
    cy = 495.9998779296875
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        clock_style = "digital"

[nightlight]
enabled = true
temperature_day = 6600
temperature_night = 5400

[notification]
background_opacity = 0.79999998211860657
scale = 0.85000000521540642

[osd]
background_opacity = 0.88999998010694981
follow_focused_output = true
offset_y = 96
position = "bottom_center"
scale = 0.90000000596046448

[plugin_settings."omerfuyar/overview"]
keybind = "SUPER + SPACE"

[plugins]
enabled = []

[shell]
avatar_path = "/home/hk/Pictures/Camera/me2.jpg"
button_borders = false
card_borders = false
clipboard_history_max_entries = 200
corner_radius_scale = 0.0
font_family = "Adwaita Sans"
lang = "en"
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.animation]
    speed = 1.3500000201165676

    [shell.launcher]
    show_app_actions = true
    width = 560

        [shell.launcher.providers.emoji]
        global = false

    [shell.panel]
    borders = false
    control_center_placement = "floating"
    floating_layer = "top"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    wallpaper_placement = "floating"
    wallpaper_position = "center"
    wallpaper_show_names = false

    [shell.screen_corners]
    size = 26

    [shell.screenshot]
    confirm_region = true
    directory = "/home/hk/Pictures/Screenshots"

    [shell.shadow]
    alpha = 0.32999999262392521

    [shell.window_switcher]
    current_workspace_only = true

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Frappe Mauve"
custom_palette = "01-catppuccin-mocha-mc"
mode = "light"
shell_mode = "dark"
source = "builtin"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "helix", "hyprland", "kitty", "qt" ]

[wallpaper]
directory = "/home/hk/Pictures/walls"
transition = [ "fade" ]
transition_duration = 1900

    [wallpaper.default]
    path = "/home/hk/Pictures/walls/13. Catppuccin Mocha.png"

    [wallpaper.last]
    path = "/home/hk/Pictures/walls/13. Catppuccin Mocha.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/hk/Pictures/walls/13. Catppuccin Mocha.png"

[widget.battery]
display_mode = "graphic"
scale = 0.60000000000000009
show_label = false

[widget.brightness]
scale = 1.1000000000000001
show_label = false

[widget.clock]
format = "{:%H:%M - %a %d %b}"

[widget.control-center]
glyph = "home"
scale = 0.90000000000000013

[widget.launcher]
glyph = "brand-open-source"

[widget.media]
hide_when_no_media = true
peek = true

[widget.network]
show_label = false

[widget.network_rx]
network_speed_compact = true
network_speed_unit = "kb"

[widget.network_tx]
network_speed_compact = true

[widget.privacy]
hide_inactive = true

[widget.volume]
peek = true
show_label = false
